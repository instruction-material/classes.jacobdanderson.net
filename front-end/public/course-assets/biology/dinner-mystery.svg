<svg xmlns="http://www.w3.org/2000/svg" width="448" height="439" viewBox="0 0 448 439" role="img" aria-labelledby="title description">
  <title id="title">Dinner Mystery</title>
  <desc id="description">Grouped bars show fictional relative changes in simple sugar, amino acid and fatty acid, respectively. A: 16, 2, 1. B: 1, 14, 2. C: 2, 1, 15. D: 6, 7, 5.</desc>
  <defs>
    <pattern id="stripes" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#dce8ed"/><path d="M-2 2 L2 -2 M0 7 L7 0 M5 9 L9 5" stroke="#294b64" stroke-width="2"/></pattern>
  </defs>
  <rect x="0" y="0" width="448" height="439" fill="#fcfdfa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#18352e">
    <text x="16" y="37" font-size="31" font-weight="bold">Dinner Mystery</text>
    <text x="16" y="66" font-size="20">Molecule changes in four fictional guests</text>
    <rect x="17" y="85" width="18" height="17" fill="#255d50" stroke="#263e39"/>
    <text x="41" y="100" font-size="17">Simple sugar</text>
    <rect x="177" y="85" width="18" height="17" fill="url(#stripes)" stroke="#263e39"/>
    <text x="201" y="100" font-size="17">Amino acid</text>
    <rect x="316" y="85" width="18" height="17" fill="#ffffff" stroke="#263e39"/>
    <text x="340" y="100" font-size="17">Fatty acid</text>
    <text x="16" y="141" font-size="19" font-weight="bold">Relative change (fictional units)</text>
    <line x1="44" y1="365" x2="432" y2="365" stroke="#667c74" stroke-width="2"/>
    <text x="34" y="371" font-size="17" text-anchor="end">0</text>
    <line x1="44" y1="317" x2="432" y2="317" stroke="#c4d1ca" stroke-width="1"/>
    <text x="34" y="323" font-size="17" text-anchor="end">4</text>
    <line x1="44" y1="269" x2="432" y2="269" stroke="#c4d1ca" stroke-width="1"/>
    <text x="34" y="275" font-size="17" text-anchor="end">8</text>
    <line x1="44" y1="221" x2="432" y2="221" stroke="#c4d1ca" stroke-width="1"/>
    <text x="34" y="227" font-size="17" text-anchor="end">12</text>
    <line x1="44" y1="173" x2="432" y2="173" stroke="#c4d1ca" stroke-width="1"/>
    <text x="34" y="179" font-size="17" text-anchor="end">16</text>
    <line x1="44" y1="173" x2="44" y2="365" stroke="#667c74" stroke-width="1"/>
    <g id="guest-a">
      <rect x="56" y="173" width="20" height="192" fill="#255d50" stroke="#263e39"/>
      <text x="66" y="167" font-size="17" text-anchor="middle" font-weight="bold">16</text>
      <rect x="82" y="341" width="20" height="24" fill="url(#stripes)" stroke="#263e39"/>
      <text x="92" y="335" font-size="17" text-anchor="middle" font-weight="bold">2</text>
      <rect x="108" y="353" width="20" height="12" fill="#ffffff" stroke="#263e39"/>
      <text x="118" y="347" font-size="17" text-anchor="middle" font-weight="bold">1</text>
      <text x="92" y="393" font-size="21" text-anchor="middle" font-weight="bold">A</text>
    </g>
    <g id="guest-b">
      <rect x="150" y="353" width="20" height="12" fill="#255d50" stroke="#263e39"/>
      <text x="160" y="347" font-size="17" text-anchor="middle" font-weight="bold">1</text>
      <rect x="176" y="197" width="20" height="168" fill="url(#stripes)" stroke="#263e39"/>
      <text x="186" y="191" font-size="17" text-anchor="middle" font-weight="bold">14</text>
      <rect x="202" y="341" width="20" height="24" fill="#ffffff" stroke="#263e39"/>
      <text x="212" y="335" font-size="17" text-anchor="middle" font-weight="bold">2</text>
      <text x="186" y="393" font-size="21" text-anchor="middle" font-weight="bold">B</text>
    </g>
    <g id="guest-c">
      <rect x="244" y="341" width="20" height="24" fill="#255d50" stroke="#263e39"/>
      <text x="254" y="335" font-size="17" text-anchor="middle" font-weight="bold">2</text>
      <rect x="270" y="353" width="20" height="12" fill="url(#stripes)" stroke="#263e39"/>
      <text x="280" y="347" font-size="17" text-anchor="middle" font-weight="bold">1</text>
      <rect x="296" y="185" width="20" height="180" fill="#ffffff" stroke="#263e39"/>
      <text x="306" y="179" font-size="17" text-anchor="middle" font-weight="bold">15</text>
      <text x="280" y="393" font-size="21" text-anchor="middle" font-weight="bold">C</text>
    </g>
    <g id="guest-d">
      <rect x="338" y="293" width="20" height="72" fill="#255d50" stroke="#263e39"/>
      <text x="348" y="287" font-size="17" text-anchor="middle" font-weight="bold">6</text>
      <rect x="364" y="281" width="20" height="84" fill="url(#stripes)" stroke="#263e39"/>
      <text x="374" y="275" font-size="17" text-anchor="middle" font-weight="bold">7</text>
      <rect x="390" y="305" width="20" height="60" fill="#ffffff" stroke="#263e39"/>
      <text x="400" y="299" font-size="17" text-anchor="middle" font-weight="bold">5</text>
      <text x="374" y="393" font-size="21" text-anchor="middle" font-weight="bold">D</text>
    </g>
    <text x="233" y="423" font-size="19" text-anchor="middle" font-weight="bold">Guest</text>
  </g>
</svg>
