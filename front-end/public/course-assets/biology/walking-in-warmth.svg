<svg xmlns="http://www.w3.org/2000/svg" width="452" height="592" viewBox="0 0 452 592" role="img" aria-labelledby="title description">
  <title id="title">Walking in warmth</title>
  <desc id="description">The case reports faster breathing and heart rate, increased skin blood flow and sweating. The model traces oxygen from lungs through blood to muscle, nerve signals to sweat glands, and heat from skin to the surroundings as sweat evaporates.</desc>
  <defs>
    <marker id="arrow-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#205849"/></marker>
    <marker id="arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#244e75"/></marker>
    <marker id="arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#884626"/></marker>
  </defs>
  <rect x="0" y="0" width="452" height="592" fill="#fcfdfa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#18352e">
    <text x="18" y="38" font-size="32" font-weight="bold">Walking in warmth</text>
    <text x="18" y="70" font-size="21" font-weight="bold">Observed during the walk</text>
    <text x="18" y="97" font-size="18">Breathing and heart rates rise. Skin blood flow</text>
    <text x="18" y="120" font-size="18">increases, and sweating begins.</text>
    <line x1="18" y1="139" x2="433" y2="139" stroke="#cad6d1" stroke-width="1"/>
    <text x="18" y="172" font-size="24" font-weight="bold">Modeled interactions</text>
    <text x="18" y="216" font-size="23" fill="#205849" font-weight="bold">Material flow</text>
    <rect x="18" y="228" width="88" height="43" fill="#edf3ee" rx="5"/>
    <text x="62.0" y="256" font-size="20" text-anchor="middle" font-weight="bold">Lungs</text>
    <path d="M111 249 H162" fill="none" stroke="#205849" stroke-width="4" marker-end="url(#arrow-0)"/>
    <rect x="170" y="228" width="88" height="43" fill="#edf3ee" rx="5"/>
    <text x="214.0" y="256" font-size="20" text-anchor="middle" font-weight="bold">Blood</text>
    <path d="M263 249 H312" fill="none" stroke="#205849" stroke-width="4" marker-end="url(#arrow-0)"/>
    <rect x="320" y="228" width="109" height="43" fill="#edf3ee" rx="5"/>
    <text x="374.5" y="256" font-size="20" text-anchor="middle" font-weight="bold">Muscle</text>
    <text x="18" y="299" font-size="17">Blood carries oxygen from lungs to working muscle.</text>
    <line x1="18" y1="320" x2="433" y2="320" stroke="#cad6d1" stroke-width="1"/>
    <text x="18" y="353" font-size="23" fill="#244e75" font-weight="bold">Information flow</text>
    <rect x="18" y="365" width="114" height="43" fill="#edf3ee" rx="5"/>
    <text x="75.0" y="393" font-size="20" text-anchor="middle" font-weight="bold">Nerves</text>
    <path d="M137 386 H252" fill="none" stroke="#244e75" stroke-width="4" stroke-dasharray="9 6" marker-end="url(#arrow-1)"/>
    <rect x="260" y="365" width="169" height="43" fill="#edf3ee" rx="5"/>
    <text x="344.5" y="393" font-size="20" text-anchor="middle" font-weight="bold">Sweat glands</text>
    <text x="18" y="436" font-size="17">Nerve signals stimulate sweat secretion.</text>
    <line x1="18" y1="457" x2="433" y2="457" stroke="#cad6d1" stroke-width="1"/>
    <text x="18" y="490" font-size="23" fill="#884626" font-weight="bold">Heat transfer</text>
    <rect x="18" y="502" width="114" height="43" fill="#edf3ee" rx="5"/>
    <text x="75.0" y="530" font-size="20" text-anchor="middle" font-weight="bold">Skin</text>
    <path d="M137 523 H252" fill="none" stroke="#884626" stroke-width="4" stroke-dasharray="2 6" marker-end="url(#arrow-2)"/>
    <rect x="260" y="502" width="169" height="43" fill="#edf3ee" rx="5"/>
    <text x="344.5" y="530" font-size="20" text-anchor="middle" font-weight="bold">Surroundings</text>
    <text x="18" y="573" font-size="17">Evaporation of sweat carries heat away from skin.</text>
  </g>
</svg>
