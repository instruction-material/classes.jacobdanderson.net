    swift-tracker-ui:
        strategy:
            fail-fast: false
            matrix:
                course: [tracker, swiftdata]
        needs: swift-browser
        runs-on: macos-26
        timeout-minutes: 60
        permissions:
            contents: read
            actions: read
        env:
            CLASSES_FAMILY_TASK_ID: swift-tracker-ui-${{ matrix.course }}
            TRACKER_COURSE: ${{ matrix.course }}
            CLASSES_FAMILY_MIN_DISK_GB: 8
            CLASSES_FAMILY_HEAVY_TIMEOUT_MS: 3300000
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24.18.0

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: swift-tracker-workflows
                  path: output/swift-tracker-workflows

            - name: Wait for the hosted Mac to settle within the native load limit
              run: |
                  python3 - <<'PY'
                  import datetime
                  import json
                  import os
                  from pathlib import Path
                  import time

                  proof = Path(os.environ["RUNNER_TEMP"]) / "swift-tracker-ui/runner-readiness.json"
                  proof.parent.mkdir(parents=True, exist_ok=True)
                  samples = []
                  deadline = time.monotonic() + 600
                  while True:
                      load = os.getloadavg()[0]
                      samples.append({"at": datetime.datetime.now(datetime.timezone.utc).isoformat(), "load": load})
                      ready = load <= 8
                      proof.write_text(json.dumps({"ready": ready, "maximumLoad": 8, "samples": samples}, indent=2) + "\n")
                      print(f"Hosted Mac load: {load:.2f}; required maximum: 8", flush=True)
                      if ready:
                          break
                      if time.monotonic() >= deadline:
                          raise SystemExit("Hosted Mac did not settle within ten minutes; native checks have not run")
                      time.sleep(10)
                  PY

            - name: Exercise actual exported tracker apps on two iPhone sizes
              run: node scripts/classes-family-heavy-task.mjs -- python3 test/swift-tracker-exported-ios.py --course "$TRACKER_COURSE" --browser "output/swift-tracker-workflows/swift-${TRACKER_COURSE}-browser" --proof "$RUNNER_TEMP/swift-tracker-ui/$TRACKER_COURSE/proof.json"

            - name: Retain original tracker app inputs, versions, process logs and UI results
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: swift-tracker-ui-${{ matrix.course }}
                  path: |
                      ${{ runner.temp }}/swift-tracker-ui/runner-readiness.json
                      ${{ runner.temp }}/swift-tracker-ui/**/proof.json
                      ${{ runner.temp }}/swift-tracker-ui/**/processes.jsonl
                      ${{ runner.temp }}/swift-tracker-ui/**/logs/
                      ${{ runner.temp }}/swift-tracker-ui/**/results/
                      ${{ runner.temp }}/swift-tracker-ui/**/inputs.json
                  if-no-files-found: error
                  retention-days: 7

    usaco-workflows:
        needs: test-e2e
        runs-on: ubuntu-24.04
        timeout-minutes: 55
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24.18.0
                  cache: npm
            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"
            - name: Install deps
              run: npm ci
            - name: Build front-end
              run: npm run -w front-end build
            - name: Verify restored USACO imports and native file I/O
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/playwright
              run: |
                  set -o pipefail
                  mkdir -p output/usaco-workflow
                  JAVAC="$JAVA_HOME_21_X64/bin/javac" JAVA="$JAVA_HOME_21_X64/bin/java" node --test test/usaco-course-import-browser.test.mjs | tee output/usaco-workflow/full.log

            - name: Retain USACO project workflow screenshots
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: usaco-workspace-screenshots
                  path: output/playwright/course-import-usaco-*.png
                  if-no-files-found: error
                  retention-days: 7

            - name: Retain complete USACO workflow evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: usaco-workflow-logs
                  path: output/usaco-workflow/full.log
                  if-no-files-found: ignore
                  retention-days: 7

    build:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Build
              run: npm run build
