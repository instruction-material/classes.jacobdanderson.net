                      front-end/output/web-notification-exports/
                      output/web-notification-native/
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify Web course consent, saved editions and source exports
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/web-source-screenshots
