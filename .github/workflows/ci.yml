                  COURSE_IMPORT_SCREENSHOT_DIR: output/web-contact-screenshots
              run: node --test test/web-contact-course-browser.test.mjs

            - name: Fetch the maintained contact dependency graph
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  repository: instruction-material/Web-Development-Foundations
                  ref: aed8ef2fcd7488c25c0b977b2099640e7431c55a
                  path: output/web-contact-native-source
                  persist-credentials: false

            - name: Install the maintained contact root lockfile
              working-directory: output/web-contact-native-source
