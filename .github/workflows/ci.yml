name: CI

on:
    workflow_dispatch:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    rust-workflows:
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        env:
            RUSTUP_TOOLCHAIN: 1.97.1
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Install pinned native Rust tools
              run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

            - name: Build front-end for Cargo course workflows
              run: npm run -w front-end build

            - name: Verify exact selected-role source and exported Cargo workspaces
              env:
                  RUST_CARGO_EXPORT_PROOF_DIR: output/rust-cargo-exports
              run: npm exec -w front-end -- vitest run test/rust-cargo-workspace.spec.test.ts --no-file-parallelism --maxWorkers=1

            - name: Verify actual course consent, edits and saved continuations
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/rust-cargo-screenshots
                  RUST_CARGO_BROWSER_PROOF_DIR: output/rust-cargo-browser
              run: node --test test/rust-cargo-course-browser.test.mjs

            - name: Compile and test original and actual browser-edited Cargo exports
              run: python3 test/rust-cargo-exported-contracts.py --exports front-end/output/rust-cargo-exports --browser output/rust-cargo-browser --proof output/rust-cargo-native/proof.json

            - name: Retain Cargo browser and native evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: rust-cargo-workflows
                  path: |
                      front-end/output/rust-cargo-exports/
                      output/rust-cargo-browser/
                      output/rust-cargo-native/
                      output/rust-cargo-screenshots/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify complete ownership imports and source exports
              env:
                  RUST_OWNERSHIP_EXPORT_PROOF_DIR: output/rust-ownership-exports
              run: npm exec -w front-end -- vitest run test/rust-ownership-workspace.spec.test.ts --no-file-parallelism --maxWorkers=1

            - name: Verify actual ownership course actions and saved continuations
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/rust-ownership-screenshots
                  RUST_OWNERSHIP_BROWSER_PROOF_DIR: output/rust-ownership-browser
              run: node --test test/rust-ownership-course-browser.test.mjs

            - name: Compile original and browser-edited ownership exports
              run: python3 test/rust-cargo-exported-contracts.py --lesson ownership --exports front-end/output/rust-ownership-exports --browser output/rust-ownership-browser --proof output/rust-ownership-native/proof.json

            - name: Retain ownership browser and native evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: rust-ownership-workflows
                  path: |
                      front-end/output/rust-ownership-exports/
                      output/rust-ownership-browser/
                      output/rust-ownership-native/
                      output/rust-ownership-screenshots/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify complete borrowing imports and source exports
              env:
                  RUST_BORROWING_EXPORT_PROOF_DIR: output/rust-borrowing-exports
              run: npm exec -w front-end -- vitest run test/rust-borrowing-workspace.spec.test.ts --no-file-parallelism --maxWorkers=1

            - name: Verify actual borrowing course actions and saved continuations
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/rust-borrowing-screenshots
                  RUST_BORROWING_BROWSER_PROOF_DIR: output/rust-borrowing-browser
              run: node --test test/rust-borrowing-course-browser.test.mjs

            - name: Compile original and browser-edited borrowing exports
              run: python3 test/rust-cargo-exported-contracts.py --lesson borrowing --exports front-end/output/rust-borrowing-exports --browser output/rust-borrowing-browser --proof output/rust-borrowing-native/proof.json

            - name: Retain borrowing browser and native evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: rust-borrowing-workflows
                  path: |
                      front-end/output/rust-borrowing-exports/
                      output/rust-borrowing-browser/
                      output/rust-borrowing-native/
                      output/rust-borrowing-screenshots/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify complete typed-errors imports and source exports
              env:
                  RUST_TYPED_ERRORS_EXPORT_PROOF_DIR: output/rust-typed-errors-exports
              run: npm exec -w front-end -- vitest run test/rust-typed-errors-workspace.spec.test.ts --no-file-parallelism --maxWorkers=1

            - name: Verify actual typed-errors course actions and saved continuations
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/rust-typed-errors-screenshots
                  RUST_TYPED_ERRORS_BROWSER_PROOF_DIR: output/rust-typed-errors-browser
              run: node --test test/rust-typed-errors-course-browser.test.mjs

            - name: Compile original and browser-edited typed-errors exports
              run: python3 test/rust-cargo-exported-contracts.py --lesson typed-errors --exports front-end/output/rust-typed-errors-exports --browser output/rust-typed-errors-browser --proof output/rust-typed-errors-native/proof.json

            - name: Retain typed-errors browser and native evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: rust-typed-errors-workflows
                  path: |
                      front-end/output/rust-typed-errors-exports/
                      output/rust-typed-errors-browser/
                      output/rust-typed-errors-native/
                      output/rust-typed-errors-screenshots/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify complete label-slices imports and source exports
              env:
                  RUST_LABEL_SLICES_EXPORT_PROOF_DIR: output/rust-label-slices-exports
              run: npm exec -w front-end -- vitest run test/rust-label-slices-workspace.spec.test.ts --no-file-parallelism --maxWorkers=1

            - name: Verify actual label-slices course actions and saved continuations
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/rust-label-slices-screenshots
                  RUST_LABEL_SLICES_BROWSER_PROOF_DIR: output/rust-label-slices-browser
              run: node --test test/rust-label-slices-course-browser.test.mjs

            - name: Compile original and browser-edited label-slices exports
              run: python3 test/rust-cargo-exported-contracts.py --lesson label-slices --exports front-end/output/rust-label-slices-exports --browser output/rust-label-slices-browser --proof output/rust-label-slices-native/proof.json

            - name: Retain label-slices browser and native evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: rust-label-slices-workflows
                  path: |
                      front-end/output/rust-label-slices-exports/
                      output/rust-label-slices-browser/
                      output/rust-label-slices-native/
                      output/rust-label-slices-screenshots/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify complete state-models imports and source exports
              env:
                  RUST_STATE_MODELS_EXPORT_PROOF_DIR: output/rust-state-models-exports
              run: npm exec -w front-end -- vitest run test/rust-state-models-workspace.spec.test.ts --no-file-parallelism --maxWorkers=1

            - name: Verify actual state-models course actions and saved continuations
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/rust-state-models-screenshots
                  RUST_STATE_MODELS_BROWSER_PROOF_DIR: output/rust-state-models-browser
              run: node --test test/rust-state-models-course-browser.test.mjs

            - name: Compile original and browser-edited state-models exports
              run: python3 test/rust-cargo-exported-contracts.py --lesson state-models --exports front-end/output/rust-state-models-exports --browser output/rust-state-models-browser --proof output/rust-state-models-native/proof.json

            - name: Retain state-models browser and native evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: rust-state-models-workflows
                  path: |
                      front-end/output/rust-state-models-exports/
                      output/rust-state-models-browser/
                      output/rust-state-models-native/
                      output/rust-state-models-screenshots/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify complete trait-pipeline imports and source exports
              env:
                  RUST_TRAIT_PIPELINE_EXPORT_PROOF_DIR: output/rust-trait-pipeline-exports
              run: npm exec -w front-end -- vitest run test/rust-trait-pipeline-workspace.spec.test.ts --no-file-parallelism --maxWorkers=1

            - name: Verify actual trait-pipeline course actions and saved continuations
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/rust-trait-pipeline-screenshots
                  RUST_TRAIT_PIPELINE_BROWSER_PROOF_DIR: output/rust-trait-pipeline-browser
              run: node --test test/rust-trait-pipeline-course-browser.test.mjs

            - name: Compile original and browser-edited trait-pipeline exports
              run: python3 test/rust-cargo-exported-contracts.py --lesson trait-pipeline --exports front-end/output/rust-trait-pipeline-exports --browser output/rust-trait-pipeline-browser --proof output/rust-trait-pipeline-native/proof.json

            - name: Retain trait-pipeline browser and native evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: rust-trait-pipeline-workflows
                  path: |
                      front-end/output/rust-trait-pipeline-exports/
                      output/rust-trait-pipeline-browser/
                      output/rust-trait-pipeline-native/
                      output/rust-trait-pipeline-screenshots/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify complete bounded-cli imports and source exports
              env:
                  RUST_BOUNDED_CLI_EXPORT_PROOF_DIR: output/rust-bounded-cli-exports
              run: npm exec -w front-end -- vitest run test/rust-bounded-cli-workspace.spec.test.ts --no-file-parallelism --maxWorkers=1

            - name: Verify actual bounded-cli course actions and saved continuations
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/rust-bounded-cli-screenshots
                  RUST_BOUNDED_CLI_BROWSER_PROOF_DIR: output/rust-bounded-cli-browser
              run: node --test test/rust-bounded-cli-course-browser.test.mjs

            - name: Compile original and browser-edited bounded-cli exports
              run: python3 test/rust-cargo-exported-contracts.py --lesson bounded-cli --exports front-end/output/rust-bounded-cli-exports --browser output/rust-bounded-cli-browser --proof output/rust-bounded-cli-native/proof.json

            - name: Retain bounded-cli browser and native evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: rust-bounded-cli-workflows
                  path: |
                      front-end/output/rust-bounded-cli-exports/
                      output/rust-bounded-cli-browser/
                      output/rust-bounded-cli-native/
                      output/rust-bounded-cli-screenshots/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify complete concurrency, boundary and capstone imports and exports
              env:
                  RUST_FINAL_EXPORT_PROOF_DIR: output
              run: npm exec -w front-end -- vitest run test/rust-final-workspaces.spec.test.ts --no-file-parallelism --maxWorkers=1

            - name: Verify actual concurrency course actions and saved continuations
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/rust-concurrency-screenshots
                  RUST_CONCURRENCY_BROWSER_PROOF_DIR: output/rust-concurrency-browser
              run: node --test test/rust-concurrency-course-browser.test.mjs

            - name: Compile original and browser-edited concurrency exports without Git
              run: python3 test/rust-cargo-exported-contracts.py --lesson concurrency --exports front-end/output/rust-concurrency-exports --browser output/rust-concurrency-browser --proof output/rust-concurrency-native/proof.json

            - name: Retain concurrency browser and native evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: rust-concurrency-workflows
                  path: |
                      front-end/output/rust-concurrency-exports/
                      output/rust-concurrency-browser/
                      output/rust-concurrency-native/
                      output/rust-concurrency-screenshots/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify actual boundary-review course actions and saved continuations
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/rust-boundary-review-screenshots
                  RUST_BOUNDARY_REVIEW_BROWSER_PROOF_DIR: output/rust-boundary-review-browser
              run: node --test test/rust-boundary-review-course-browser.test.mjs

            - name: Compile original and browser-edited boundary-review exports without Git
              run: python3 test/rust-cargo-exported-contracts.py --lesson boundary-review --exports front-end/output/rust-boundary-review-exports --browser output/rust-boundary-review-browser --proof output/rust-boundary-review-native/proof.json

            - name: Retain boundary-review browser and native evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: rust-boundary-review-workflows
                  path: |
                      front-end/output/rust-boundary-review-exports/
                      output/rust-boundary-review-browser/
                      output/rust-boundary-review-native/
                      output/rust-boundary-review-screenshots/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify actual record-hardening course actions and saved continuations
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/rust-record-hardening-screenshots
                  RUST_RECORD_HARDENING_BROWSER_PROOF_DIR: output/rust-record-hardening-browser
              run: node --test test/rust-record-hardening-course-browser.test.mjs

            - name: Compile original and browser-edited record-hardening exports without Git
              run: python3 test/rust-cargo-exported-contracts.py --lesson record-hardening --exports front-end/output/rust-record-hardening-exports --browser output/rust-record-hardening-browser --proof output/rust-record-hardening-native/proof.json

            - name: Retain record-hardening browser and native evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: rust-record-hardening-workflows
                  path: |
                      front-end/output/rust-record-hardening-exports/
                      output/rust-record-hardening-browser/
                      output/rust-record-hardening-native/
                      output/rust-record-hardening-screenshots/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7

    backend-install:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm
                  cache-dependency-path: back-end/package-lock.json

            - name: Pin npm version
              run: |
                  npm -v
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Verify standalone backend install policy
              run: node --test test/standalone-backend-install-policy.test.mjs

            - name: Install backend deps with backend lockfile
              working-directory: back-end
              run: npm ci --include=optional --strict-allow-scripts --workspaces=false

            - name: Validate backend dependency tree
              working-directory: back-end
              run: npm ls --all --workspaces=false

            - name: Audit backend dependency tree
              working-directory: back-end
              run: npm audit --include=optional --workspaces=false

    lint:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            # Make runner's npm match packageManager in package.json
            - name: Pin npm version
              run: |
                  npm -v
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Validate dependency tree
              run: npm run check:dependencies

            - name: Verify root lock provenance
              run: npm run test:lock-provenance

            - name: Dependency security audit
              run: npm audit --include=optional

            - name: Brace parser security and compatibility regressions
              run: npm run test:braces-security

            - name: Dependency advisory compatibility regressions
              run: node --test --test-timeout=10000 test/dependency-advisory-regressions.test.mjs

            # Root "lint" runs front-end and back-end lint
            - name: Lint
              run: npm run lint

    typecheck:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

    test:
        runs-on: ubuntu-24.04
        strategy:
            matrix:
                node-version: [24.18.0]
                os: [ubuntu-24.04]
            fail-fast: false

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix['node-version'] }}
                  cache: npm
                  registry-url: https://registry.npmjs.org/

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              id: unit_dependencies
              run: npm ci

            - name: Unit tests
              env:
                  VITEST_WATCH: "false"
              run: |
                  ulimit -n 4096 || true
                  npm run -w front-end test:unit

            - name: Verify heavy-task descendant cleanup and lock release
              if: ${{ !cancelled() && steps.unit_dependencies.outcome == 'success' }}
              run: node --test test/classes-family-heavy-task.test.mjs

            - name: Scratch first-lesson event and archive regressions
              run: node --test test/scratch-name-events.test.mjs

            - name: Preserve authored course source checks
              run: node --test test/course-source-readiness.test.mjs

            - name: Backend tests
              if: ${{ !cancelled() && steps.unit_dependencies.outcome == 'success' }}
              env:
                  VITEST_WATCH: "false"
              run: npm run -w back-end test

            - name: Native deployment contract tests
              run: npm run test:native-deployment

            - name: Turtle input compatibility
              run: python3 -B test/turtle-input-box.test.py

            - name: Verify root snapshot and separate runtime ownership
              run: sudo python3 -B test/native-candidate-ownership.test.py

    accessibility:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Build front-end for accessibility checks
              run: npm run -w front-end build

            - name: Axe accessibility smoke checks
              run: npm run a11y

    static-media:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Install deps
              run: npm ci

            - name: Static media fetch policy tests
              run: npm run test:static-media-fetch

            - name: Audit static course media
              run: npm run audit:static-media

    native-nginx:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0

            - name: Install native Nginx fixture dependency
              run: |
                  if ! command -v nginx >/dev/null 2>&1; then
                    sudo apt-get update
                    sudo apt-get install --no-install-recommends --yes nginx
                  fi

            - name: Exercise native Nginx routing
              run: npm run test:native-nginx

    native-course-workflows:
        runs-on: ubuntu-24.04
        timeout-minutes: 75
        strategy:
            fail-fast: false
            max-parallel: 2
            matrix:
                course: [assembly, linux, c17, cpp]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm
                  registry-url: https://registry.npmjs.org/

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Verify preview readiness failure recovery
              run: node --test test/preview-readiness.test.mjs

            - name: Install deps
              run: npm ci

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/Cypress
                  key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Build front-end
              run: npm run -w front-end build

            - name: Install native Assembly debugger
              if: ${{ matrix.course == 'assembly' }}
              run: sudo apt-get update && sudo apt-get install -y gdb binutils strace

            - name: Export Assembly default and pack workspaces
