            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  test "$(npm --version)" = "12.0.1"

            - name: Install checked dependencies
              run: npm ci

            - name: Build the course browser
              run: npm run -w front-end build

            - name: Verify Swift profile consent, saved roles and source ZIP exports
