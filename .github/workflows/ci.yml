    test-e2e:
        needs: native-course-workflows
        runs-on: ubuntu-24.04
        timeout-minutes: 75
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.18.0
                  cache: npm
                  registry-url: https://registry.npmjs.org/

            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"

            - name: Verify preview readiness failure recovery
              run: node --test test/preview-readiness.test.mjs

            - name: Install deps
              run: npm ci

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/Cypress
                  key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Build front-end
              run: npm run -w front-end build

            - name: Verify saved project role labels and deletion context
              env:
                  COURSE_IMPORT_SCREENSHOT_DIR: output/playwright
              run: node --test test/ide-saved-project-labels-browser.test.mjs

            - name: Verify Scratch classroom import, execution and downloads
              env:
                  SCRATCH_SCREENSHOT_DIR: output/playwright
