            - name: Retain Scratch conditional lesson screenshots
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: scratch-conditional-screenshots
                  path: front-end/output/playwright/scratch-conditionals-*.png
                  if-no-files-found: error
                  retention-days: 7

            - name: Compare game text with native Pygame font metrics
              run: node --test test/pgzero-default-font-browser.test.mjs

