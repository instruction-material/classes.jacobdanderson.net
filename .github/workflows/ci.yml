            - name: Cypress
              uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # v7.4.1
              env:
                  CYPRESS_BASE_URL: http://127.0.0.1:3333
              with:
                  install: false
                  working-directory: front-end
                  config-file: cypress.config.ts
                  start: npm run preview -- --host 127.0.0.1 --port 3333 --strictPort
                  wait-on: "node ../scripts/wait-for-loopback-preview.mjs"

    course-workflows:
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24.18.0
                  cache: npm
            - name: Pin npm version
              run: |
                  npm i -g npm@12.0.1
                  npm -v
                  test "$(npm --version)" = "12.0.1"
            - name: Install deps
              run: npm ci
            - name: Build front-end
              run: npm run -w front-end build
            - name: Verify and record the complete normalized course catalog
              env:
                  COURSE_CATALOG_PROOF_DIR: ${{ github.workspace }}/output/course-catalog
              run: npm exec -w front-end -- vitest run test/store.courses.catalog-identities.spec.test.ts --no-file-parallelism --maxWorkers=1

            - name: Retain normalized course catalog evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: course-catalog-workflows
                  path: output/course-catalog/
                  if-no-files-found: error
                  retention-days: 7

            - name: Verify notification source imports and saved code exports
              env:
                  WEB_NOTIFICATION_EXPORT_DIR: output/web-notification-exports
