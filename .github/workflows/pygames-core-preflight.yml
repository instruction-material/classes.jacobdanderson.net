name: Course preflight

run-name: ${{ inputs.course == 'machine-learning-library' && 'Machine Learning library projects and native exports' || inputs.course == 'javascript-superstar-readings' && 'JavaScript Superstar complete lessons and local CSS practice' || inputs.course == 'machine-learning-neurons' && 'Worked machine learning lessons and Python workflows' || inputs.course == 'machine-learning' && 'Machine Learning offline core and source workflows' || inputs.course == 'network-practice' && 'Network complete teaching and practice workflows' || inputs.course == 'tracker-evidence' && inputs.browser_artifact_id != '' && 'Welcome native UI verification' || inputs.course == 'network-capstone-optional' && 'Network capstone identity and optional workflows' || inputs.course == 'network-diagnostics-five' && 'Network diagnostics workflows' || inputs.course == 'network-kernel-optional' && 'Network routing and capture workflows' || inputs.course == 'network-firewall-optional' && 'Network optional firewall workflows' || inputs.course == 'network-dns-optional' && 'Network optional DNS workflows' || inputs.course == 'ai-studios' && 'AI search and game studios' || inputs.course == 'swift-map' && 'Swift Map course and native checks' || inputs.course == 'native-release-evidence' && 'Native release file verification' || inputs.course == 'tracker-evidence' && 'Retained Tracker failure evidence' || inputs.course == 'scratch-tasks' && 'Published Scratch project tasks' || inputs.course == 'course-audit' && 'Course audit follow-ups' || inputs.course == 'scratch-readings' && 'Scratch and self-study readings' || inputs.course == 'scratch-originals' && 'Original Scratch imports' || inputs.course == 'bootcamp' && 'Scratch Bootcamp pages' || inputs.course == 'self-study' && 'Self-study course pages' || inputs.course == 'physics-models' && 'Physics model workflows' || inputs.course == 'networking' && 'Swift Networking source evidence' || inputs.course == 'ai-setup' && 'AI setup reading' || 'PyGames core preflight' }}

on:
  workflow_dispatch:
    inputs:
      course:
        description: Course verification to run
        type: choice
        options: [data-science-report, data-science-grouped, data-science-cleaning, data-science-csv, machine-learning-library, javascript-superstar-readings, machine-learning-neurons, machine-learning, network-practice, network-archive-six, javascript-circle-march, network-capstone-optional, network-diagnostics-five, network-kernel-optional, network-firewall-optional, network-dns-optional, java-refactoring-followup, java-refactoring-final, release-checks, ai-studios, swift-map, javascript-business-directory, java-testability, java-pattern-journeys, java-generalization, java-method-calls, javascript-hundred-squares, javascript-businesses, javascript-small-talk, java-conditional-flow, javascript-lyrics, javascript-weather, vendored-d3, java-value-data, course-choices, javascript-checkpoints, javascript-snowflake, dependency-repair, java-ownership-move, java-composing, java-refactoring, java-studios, java-capstone, java-judgment, java-architecture, java-collaboration, java-behavioral, java-structural, java-boundary, java-creational, java-foundations, java-patterns, java-recursion, pygames, networking, ai-setup, self-study, physics-models, bootcamp, scratch-originals, scratch-readings, course-audit, scratch-tasks, tracker-evidence, native-release-evidence]
        default: pygames
      full_source_runtime:
        description: Also verify every pinned original PyGames runtime profile
        type: boolean
        default: false
      browser_run_id:
        description: Networking browser export workflow run
        type: string
      self_study_courses:
        description: Optional comma-separated self-study course IDs; validated by the browser check
        type: string
      browser_artifact_id:
        description: Networking browser export artifact
        type: string

      native_run_id:
        description: Retained native result producer run
        type: string
      native_artifact_id:
        description: Retained native result artifact
        type: string
      native_artifact_sha256:
        description: Independently verified original ZIP SHA256
        type: string

permissions:
  contents: read

concurrency:
  group: pygames-core-preflight-${{ github.ref }}-${{ inputs.course == 'network-practice' && 'network-practice' || inputs.course == 'network-archive-six' && 'network-archive-six' || inputs.course == 'course-choices' && 'course-choices' || (inputs.course == 'tracker-evidence' || inputs.course == 'native-release-evidence') && 'evidence' || 'validation' }}
  cancel-in-progress: false

jobs:

  network-capstone-optional:
    if: inputs.course == 'network-capstone-optional'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLASSES_FAMILY_TASK_ID: network-capstone-optional-${{ github.run_id }}
      NETWORK_CAPSTONE_OPTIONAL_ONLY: '1'
      NETWORK_BROWSER_EXPORT_PROOF_DIR: output/network-capstone-optional
      COURSE_IMPORT_SCREENSHOT_DIR: output/network-capstone-optional/screenshots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Verify the locked root installation and complete dependency graph
        run: |
          npm install --global npm@12.0.1
          test "$(npm --version)" = "12.0.1"
          mkdir -p output/network-capstone-optional/audits
          node scripts/classes-family-heavy-task.mjs -- npm ci
          npm run check:dependencies
          npm run lock:provenance:check
          npm audit --include=optional --json > output/network-capstone-optional/audits/root-full.json
          npm audit --include=optional --omit=dev --json > output/network-capstone-optional/audits/root-production.json
      - name: Verify capstone imports, existing network projects and preserved course identities
        run: >-
          node scripts/classes-family-heavy-task.mjs --
          npm exec -w front-end -- vitest run
          test/network-capstone-optional-workspace.spec.test.ts
          test/network-kernel-optional-workspace.spec.test.ts
          test/network-dns-optional-workspace.spec.test.ts
          test/network-firewall-optional-workspace.spec.test.ts
          test/network-foundations-workspace.spec.test.ts
          test/store.courses.network-systems-flow.spec.test.ts
          test/store.courses.catalog-identities.spec.test.ts
          test/store.courses.progress-identity.spec.test.ts
          --no-file-parallelism --maxWorkers=1
          --reporter=default --reporter=json
          --outputFile=../output/network-capstone-optional/unit-tests.json
      - name: Lint, check types and build the actual application
        run: |
          node scripts/classes-family-heavy-task.mjs -- npm run lint
          node scripts/classes-family-heavy-task.mjs -- npm run typecheck
          node scripts/classes-family-heavy-task.mjs -- npm run build
      - name: Verify the owned ordinary-user Linux tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3 iproute2 iptables util-linux curl dnsutils tcpdump dnsmasq-base strace
      - name: Verify real course buttons, consent, independent attempts, edits and exports
        run: node scripts/classes-family-heavy-task.mjs -- node --test test/network-course-import-browser.test.mjs
      - name: Run original and actual browser-edited exports against native routed-capstone observations
        run: node scripts/classes-family-heavy-task.mjs -- sudo python3 -B test/network-capstone-optional-exported-contracts.py output/network-capstone-optional
      - name: Make owned native evidence readable for publication
        if: always()
        run: |
          if [ -d output/network-capstone-optional ]; then sudo chmod -R a+rX output/network-capstone-optional; fi
      - name: Preserve exact candidate identity and process records
        if: always()
        run: |
          git rev-parse HEAD > output/network-capstone-optional/site-source.txt
          git diff --name-only > output/network-capstone-optional/tracked-changes.txt
          cp /tmp/classes-family-heavy-tasks.log output/network-capstone-optional/processes.jsonl
      - name: Retain original browser exports and native observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-capstone-optional-workflows
          path: output/network-capstone-optional/
          if-no-files-found: error
          retention-days: 30

  network-practice:
    if: inputs.course == 'network-practice'
