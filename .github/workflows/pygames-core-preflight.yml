              fixtures = json.loads(Path("test/fixtures/javascript-superstar-worked-reading-cases.json").read_text())
              assert fixtures["items"] == len(fixtures["cases"]) == 10
              assert readings["accepted"] and readings["fullLessonViews"] == 40
              assert readings["sourceMode"] == "exact built application preview"
              assert readings["allCompleteRenderedLessonTextsMatch"] and readings["allLastParagraphsVisible"]
              assert set(readings["actualRoles"]) == {"learner", "instructor"} and readings["widths"] == [390, 1280]
              for case in fixtures["cases"]:
                  profiles = [row for row in readings["profiles"] if row["file"] == case["file"]]
                  assert len(profiles) == 4
                  assert {(row["role"], row["width"]) for row in profiles} == {("learner", 390), ("learner", 1280), ("instructor", 390), ("instructor", 1280)}
                  assert all(row["sourceSHA256"] == case["sourceSHA256"] and row["lastParagraphVisible"] for row in profiles)
              assert readings["nativeCSSPractice"]["accepted"]
              css = json.loads((out / "javascript-css-practice/native-browser-proof.json").read_text())
              assert css["accepted"] and css["actualNativeExecutions"] == 16
              assert css["savedVisualEdits"] == 8 and css["allNativeRequestsOffline"]
              assert len(css["exports"]) == 16 and all(row["passed"] for row in css["results"])
              proof["javascriptCSSPracticeIDE"] = {"projects": 2, "roleProfiles": 8, "archives": 16, "nativeExecutions": 16}
              checkpoint = json.loads((out / "javascript-fundamentals-checkpoint/native-browser-proof.json").read_text())
              assert checkpoint["accepted"] and checkpoint["actualNativeExecutions"] == 8
              assert checkpoint["savedVisualEdits"] == 4 and checkpoint["allNativeRequestsOffline"]
              assert len(checkpoint["exports"]) == 8 and all(row["passed"] for row in checkpoint["results"])
              assert sum(row["rendered"]["scenarioExecutions"] for row in checkpoint["results"]) == 108
              proof["javascriptFundamentalsCheckpointIDE"] = {"projects": 1, "roleProfiles": 4, "archives": 8, "nativeExecutions": 8, "scenarioExecutions": 108}
              continuations = json.loads((out / "javascript-checkpoint-continuations/native-browser-proof.json").read_text())
              assert continuations["accepted"] and continuations["actualNativeExecutions"] == 24
              assert continuations["savedVisualEdits"] == 8 and continuations["allNativeRequestsOffline"]
              assert len(continuations["exports"]) == 16 and all(row["passed"] for row in continuations["results"])
              proof["javascriptCheckpointContinuations"] = {"projects": 2, "roleProfiles": 8, "archives": 16, "nativeExecutions": 24}
              assert len(readings["nativeCSSPractice"]["selections"]) == 3
              assert [row["containerWidth"] for row in readings["nativeCSSPractice"]["layouts"]] == [480, 280]
              assert native["acceptedWithinNativeExampleScope"] and native["readingFiles"] == 8
              assert native["fencedPrograms"] == 20 and native["nativeExecutions"] == 40
              assert all(row["matched"] for row in native["runs"])
              for name, value in native["files"].items():
                  assert next(row["sourceSHA256"] for row in fixtures["cases"] if row["file"] == name) == value
              proof["javascriptSuperstarReadings"] = {"items": 10, "completeViews": 40,
                                                    "nativeJavaScriptExamples": 20, "nativeJavaScriptExecutions": 40,
                                                    "nativeCSSSelectorChecks": 3, "nativeCSSLayoutWidths": [480, 280],
                                                    "lastParagraphsVisible": True}
          (out / "accepted.json").write_text(json.dumps(proof, indent=2) + "\n")
          PY
          cp /tmp/classes-family-heavy-tasks.log output/release-checks/processes.jsonl
      - name: Retain exact application verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-application-checks
          path: output/release-checks/
          if-no-files-found: error
          retention-days: 14


