          CLASSES_FAMILY_TASK_ID: swift-canonical-ios-map
          CLASSES_FAMILY_MIN_DISK_GB: 8
          CLASSES_FAMILY_HEAVY_TIMEOUT_MS: 3300000
      steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            with:
                persist-credentials: false

          - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
            with:
                node-version: 24.18.0

          - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
            with:
                name: swift-map-candidate-workflows
                path: output/swift-map-candidate

          - name: Wait for the hosted Mac to settle within the native load limit
            run: |
                python3 - <<'PY'
                import datetime
                import json
                import os
                from pathlib import Path
                import time

                proof = Path(os.environ["RUNNER_TEMP"]) / "swift-canonical-ios/runner-readiness.json"
                proof.parent.mkdir(parents=True, exist_ok=True)
                samples = []
                deadline = time.monotonic() + 600
                while True:
                    load = os.getloadavg()[0]
                    samples.append({"at": datetime.datetime.now(datetime.timezone.utc).isoformat(), "load": load})
                    ready = load <= 8
                    proof.write_text(json.dumps({"ready": ready, "maximumLoad": 8, "samples": samples}, indent=2) + "\n")
                    print(f"Hosted Mac load: {load:.2f}; required maximum: 8", flush=True)
                    if ready:
                        break
                    if time.monotonic() >= deadline:
                        raise SystemExit("Hosted Mac did not settle within ten minutes; native checks have not run")
                    time.sleep(10)
                PY

          - name: Verify course scroll gesture geometry
            if: inputs.course == 'swift-map'
            run: node scripts/classes-family-heavy-task.mjs -- python3 test/swift-course-scroll-geometry.py

          - name: Test selected course roles and largest text on two iPhone sizes
            run: node scripts/classes-family-heavy-task.mjs -- python3 test/swift-welcome-exported-ios.py --course "$SWIFT_COURSE" --browser "output/swift-map-candidate/swift-map-browser" --proof "$RUNNER_TEMP/swift-canonical-ios/$SWIFT_COURSE/proof.json"

          - name: Retain native Swift versions, process logs and UI results
            if: always()
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
            with:
                name: swift-map-candidate-native-ios
                path: |
                    ${{ runner.temp }}/swift-canonical-ios/runner-readiness.json
                    ${{ runner.temp }}/swift-canonical-ios/**/proof.json
                    ${{ runner.temp }}/swift-canonical-ios/**/processes.jsonl
                    ${{ runner.temp }}/swift-canonical-ios/**/logs/
                    ${{ runner.temp }}/swift-canonical-ios/**/results/
                    ${{ runner.temp }}/swift-canonical-ios/**/inputs.json
                if-no-files-found: error
