          --browser output/ai-studio-browser
          --source .ai-work/ai-studio-source
          --proof output/ai-studio-browser/native/proof.json
      - name: Retain native execution results and source binding
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ai-studio-native-verification
